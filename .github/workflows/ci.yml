name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Agda
      uses: wenkokke/setup-agda@v2
      with:
        agda-version: '2.6.4'
        agda-stdlib-version: '2.0'

    - name: Compile library
      run: agda src/All.agda

