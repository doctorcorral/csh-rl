name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Agda
      uses: wenkokke/setup-agda@v2
      with:
        agda-version: '2.6.4'
        agda-stdlib-version: '2.0'

    - name: Cache Agda interface files
      uses: actions/cache@v4
      with:
        path: |
          _build
          src/**/*.agdai
        key: agdai-${{ runner.os }}-${{ hashFiles('src/**/*.agda') }}
        restore-keys: |
          agdai-${{ runner.os }}-

    - name: Compile library (excluding heavy modules)
      run: agda src/All.agda

  queens8:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Agda
      uses: wenkokke/setup-agda@v2
      with:
        agda-version: '2.6.4'
        agda-stdlib-version: '2.0'

    - name: Cache Agda interface files
      uses: actions/cache@v4
      with:
        path: |
          _build
          src/**/*.agdai
        key: agdai-${{ runner.os }}-${{ hashFiles('src/**/*.agda') }}
        restore-keys: |
          agdai-${{ runner.os }}-

    - name: Compile Queens8 (full game-tree verification)
      run: agda src/CSHRL/Tasks/Verified/Queens8.agda

  sudoku9synth:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Agda
      uses: wenkokke/setup-agda@v2
      with:
        agda-version: '2.6.4'
        agda-stdlib-version: '2.0'

    - name: Cache Agda interface files
      uses: actions/cache@v4
      with:
        path: |
          _build
          src/**/*.agdai
        key: agdai-${{ runner.os }}-${{ hashFiles('src/**/*.agda') }}
        restore-keys: |
          agdai-${{ runner.os }}-

    - name: Compile synthesis demos (4x4 dynamics + concept discovery)
      run: |
        agda src/CSHRL/Tasks/Synthesized/SudokuSynth.agda
        agda src/CSHRL/Tasks/Synthesized/SudokuConceptSynth.agda
        agda src/CSHRL/Tasks/Synthesized/SudokuConceptEnum.agda
        agda src/CSHRL/Tasks/Synthesized/SudokuNonForced.agda

    - name: Compile Sudoku9Synth (9x9 automatic environment synthesis)
      run: agda src/CSHRL/Tasks/Synthesized/Sudoku9Synth.agda

    - name: Compile Sudoku9NonForced (non-forced 9x9, survival fails, Finder solves)
      run: agda src/CSHRL/Tasks/Synthesized/Sudoku9NonForced.agda

